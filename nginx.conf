# nginx *template*: the official nginx image runs envsubst on it at container start (see docker/10-upstream.envsh).
#   API_UPSTREAM    where /api is proxied to, e.g. http://host.docker.internal:3100 (no trailing slash, no path)
#   API_HOST        host[:port] of API_UPSTREAM, sent as the Host header (derived)
#   NGINX_RESOLVER  DNS server nginx uses to look the upstream up (derived from /etc/resolv.conf)
# The upstream is resolved per request through a variable, so nginx starts even if the API is down or does not exist yet
# (requests to /api then answer 502 until it is reachable) instead of crashing with "host not found in upstream".
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 25m;   # attachment uploads

  resolver ${NGINX_RESOLVER} valid=10s ipv6=off;
  resolver_timeout 5s;
  set $api_upstream "${API_UPSTREAM}";
  set $api_host "${API_HOST}";

  # liveness probe of the web container itself (does not touch the API)
  location = /healthz {
    default_type text/plain;
    add_header Cache-Control "no-store";
    return 200 "ok\n";
  }

  # startup snapshot written by docker/10-upstream.envsh (DNS, port and HTTP result)
  location = /healthz-upstream.txt {
    default_type text/plain;
    add_header Cache-Control "no-store";
  }

  # diagnostics: shows which upstream this container uses and whether it answers (open it in the browser)
  location = /healthz/api {
    set $api_health "${API_UPSTREAM}/api/v1/health";
    proxy_pass $api_health;
    proxy_http_version 1.1;
    proxy_set_header Host $api_host;
    proxy_ssl_server_name on;
    proxy_ssl_name $api_host;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 4;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_connect_timeout 5s;
    error_page 502 503 504 = @health_down;
  }
  location @health_down {
    default_type application/json;
    return 502 '{"reachable":false,"upstream":"${API_UPSTREAM}","hint":"check the container log line starting with 10-upstream"}';
  }

  location /api/ {
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    # the API sits behind its own reverse proxy (Coolify/Traefik), which routes by Host: send the API's host, not ours
    proxy_set_header Host $api_host;
    # https upstream: send SNI and verify the certificate (ignored for plain http upstreams)
    proxy_ssl_server_name on;
    proxy_ssl_name $api_host;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 4;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    # friendly JSON instead of nginx's HTML page when the API is unreachable
    proxy_intercept_errors off;
    error_page 502 503 504 = @api_down;
  }
  location @api_down {
    default_type application/json;
    return 502 '{"error":{"code":"upstream.unavailable","message":"The server is not reachable right now. Please try again in a moment."}}';
  }

  # hashed build assets: cache hard
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # logo and other static files from public/
  location = /logo.png {
    expires 7d;
    try_files $uri =404;
  }

  # SPA fallback
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
